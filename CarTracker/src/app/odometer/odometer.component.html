<div class="container d-flex justify-content-center mt-5">
    <div class="card shadow p-4 rounded col-md-6 col-sm-10">
      <h4 class="text-center mb-4">Update Odometer</h4>
  
      <!-- Vehicle Dropdown -->
      <div class="mb-4">
        <label class="form-label">Select Vehicle:</label>
        <select class="form-select form-select-lg">
          <option selected>Toyota Hilux 2013</option>
          <!-- dynamically add more vehicles -->
        </select>
        <div class="text-end text-muted small mt-2">
          <strong>Last Odometer:</strong> 125000 km<br>
          <strong>Date:</strong> 02/02/2025
        </div>
      </div>
  
      <!-- Date Picker -->
      <div class="mb-4">
        <label class="form-label">Date</label>
        <input type="date" class="form-control form-control-lg" value="2025-08-17">
      </div>
  
      <!-- Odometer Input -->
      <div class="mb-4">
        <label class="form-label">Enter Odometer</label>
        <div class="input-group input-group-lg">
          <input type="number" class="form-control" placeholder="Km">
          <span class="input-group-text">Km</span>
        </div>
      </div>
  
      <!-- Save Button -->
      <div class="d-grid">
        <button class="btn btn-primary btn-lg">
          <i class="bi bi-save"></i> Save Odometer
        </button>
      </div>
    </div>
  </div>
