<div class="container d-flex justify-content-center align-items-center mt-4">
    <div class="card shadow p-4 rounded col-md-6 col-sm-10">
      <h3 class="text-center mb-4">Create an Account</h3>
  
      <form (ngSubmit)="signup()">
        <!-- Name -->
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input [(ngModel)]="name" name="name" type="text" id="name" class="form-control" placeholder="Your full name" required>
        </div>
  
        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input [(ngModel)]="email" name="email" type="email" id="email" class="form-control" placeholder="you@example.com" required="">
        </div>
        <!-- Phone Number -->
         <div class="mb-3">
          <label for="phone" class="form-label">Phone Number</label>
          <input [(ngModel)]="phone" name="phone" type="tel" id="phone" class="form-control" placeholder="Your phone number" required="">
        </div>
  
        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input [(ngModel)]="password" name="password" type="password" id="password" class="form-control" placeholder="Create a password">
        </div>
        <!-- Confirm Password -->
         <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" id="confirmPassword" class="form-control" placeholder="Confirm password">
        </div>
  
  
        <!-- Sign-Up Button -->
        <div class="d-grid">
          <button type="submit" class="btn btn-success">Sign Up</button>
        </div>
  
        <!-- Sign-in Link -->
        <p class="mt-3 text-center">
          Already have an account? <a [routerLink]="['/signin']">Sign in</a>
        </p>
      </form>
    </div>
  </div>
